<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fixed Favorites Test</title>

<style>
html, body {
  height: 100%;
  margin: 0;
}

/* fixed bar */
#favorites {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 120px;
  background: white;
  border-bottom: 2px solid black;
  z-index: 10;
}

/* scroll area */
#gallery {
  position: absolute;
  top: 120px;
  left: 0;
  right: 0;
  bottom: 0;
  overflow-y: auto;
  background: lightgray;
}

.box {
  height: 150px;
  margin: 20px;
  background: steelblue;
}
</style>
</head>

<body>

<div id="favorites">
  FIXED FAVORITES (should never move)
</div>

<div id="gallery">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</div>

</body>
</html>
